openapi: 3.0.3
info:
  title: Devoluciones - SportMarket S.A.S.
  version: 1.0.0
  description: 'Contrato API del microservicio Devoluciones (framework Flask; base de datos: devoluciones_db). Generado
    a partir de las tablas de contratos de la Entrega 2. Se accede únicamente a través del API Gateway.'
servers:
- url: http://localhost:8080
  description: API Gateway (desarrollo)
paths:
  /api/devoluciones:
    get:
      operationId: get_api_devoluciones
      summary: Consultar devoluciones
      description: 'Consultar devoluciones (filtros: tipo, estado_inventario, producto_id, desde, hasta, page, limit)'
      x-roles:
      - Todos
      parameters:
      - name: tipo
        in: query
        required: false
        schema:
          type: string
      - name: estado_inventario
        in: query
        required: false
        schema:
          type: string
      - name: producto_id
        in: query
        required: false
        schema:
          type: integer
      - name: desde
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: hasta
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
        '400':
          description: Solicitud incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: post_api_devoluciones
      summary: Registrar devolución
      description: Registrar devolución
      x-roles:
      - Administrador
      - Responsable de inventario
      - Responsable de compras
      - Operador de bodega
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tipo:
                  type: string
                  description: CLIENTE o PROVEEDOR
                motivo:
                  type: string
                  maxLength: 200
                  description: Motivo de la devolución
                bodega_id:
                  type: integer
                  description: Bodega donde reingresa o de donde sale la mercancía
                proveedor_id:
                  type: integer
                  description: Proveedor destinatario (dato informativo, no se valida)
                documento_ref:
                  type: string
                  maxLength: 40
                  description: Documento de venta u orden de compra relacionada
                detalles:
                  type: array
                  description: Productos devueltos
                  items:
                    type: object
                    properties:
                      producto_id:
                        type: integer
                        description: Producto devuelto
                      cantidad:
                        type: integer
                        description: Unidades; mayor que cero
                      condicion:
                        type: string
                        description: BUEN_ESTADO o DEFECTUOSO. Debe omitirse en devoluciones a proveedor
                    required:
                    - producto_id
                    - cantidad
                    - condicion
              required:
              - tipo
              - motivo
              - bodega_id
              - proveedor_id
              - detalles
      responses:
        '201':
          description: Creado
        '400':
          description: Solicitud incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos que incumplen las reglas de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/devoluciones/{id}:
    get:
      operationId: get_api_devoluciones_id
      summary: Consultar una devolución con el detalle de cada línea
      description: Consultar una devolución con el detalle de cada línea
      x-roles:
      - Todos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/devoluciones/{id}/procesar:
    post:
      operationId: post_api_devoluciones_id_procesar
      summary: Procesar la devolución en Inventario
      description: Procesar la devolución en Inventario
      x-roles:
      - Administrador
      - Responsable de inventario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto con el estado actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos que incumplen las reglas de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Servicio necesario no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  schemas:
    Error:
      type: object
      properties:
        codigo:
          type: string
          example: STOCK_INSUFICIENTE
        mensaje:
          type: string
        detalles:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              error:
                type: string
        correlation_id:
          type: string
          format: uuid
security:
- bearerAuth: []
