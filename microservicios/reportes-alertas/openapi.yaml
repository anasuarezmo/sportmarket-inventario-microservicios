openapi: 3.0.3
info:
  title: Reportes y Alertas - SportMarket S.A.S.
  version: 1.0.0
  description: Contrato API del microservicio Reportes y Alertas (Flask; base de datos reportes_db, solo la tabla
    alerta). Los informes se calculan al consultarlos con datos de Inventario y Catalogo. Se accede unicamente a
    traves del API Gateway.
servers:
- url: http://localhost:8080
  description: API Gateway (desarrollo)
paths:
  /api/reportes/inventario:
    get:
      operationId: get_api_reportes_inventario
      summary: Existencias actuales por producto y bodega
      description: 'Existencias actuales por producto y bodega (filtros: categoria_id, bodega_id)'
      x-roles:
      - Administrador
      - Responsable de inventario
      - Responsable de compras
      - Usuario de consulta
      parameters:
      - name: categoria_id
        in: query
        required: false
        schema:
          type: integer
      - name: bodega_id
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
        '503':
          description: Servicio necesario no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
        '403':
          description: Rol sin permiso
  /api/reportes/valorizacion:
    get:
      operationId: get_api_reportes_valorizacion
      summary: Valor a precio de venta del inventario
      description: 'Valor a precio de venta del inventario (filtro: categoria_id)'
      x-roles:
      - Administrador
      - Responsable de inventario
      - Responsable de compras
      - Usuario de consulta
      parameters:
      - name: categoria_id
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
        '503':
          description: Servicio necesario no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
        '403':
          description: Rol sin permiso
  /api/reportes/rotacion:
    get:
      operationId: get_api_reportes_rotacion
      summary: Productos de mayor y menor rotación
      description: 'Productos de mayor y menor rotación (parámetros: desde, hasta, limite)'
      x-roles:
      - Administrador
      - Responsable de inventario
      - Responsable de compras
      - Usuario de consulta
      responses:
        '200':
          description: OK
        '400':
          description: Solicitud incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Servicio necesario no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
        '403':
          description: Rol sin permiso
      parameters:
      - name: desde
        in: query
        required: false
        description: AAAA-MM-DD. Por defecto, 30 dias antes de hasta
        schema:
          type: string
          format: date
      - name: hasta
        in: query
        required: false
        description: AAAA-MM-DD. Por defecto, hoy
        schema:
          type: string
          format: date
      - name: limite
        in: query
        required: false
        description: Cuantos productos por lista (1 a 50, por defecto 5)
        schema:
          type: integer
          minimum: 1
          maximum: 50
  /api/reportes/movimientos:
    get:
      operationId: get_api_reportes_movimientos
      summary: Resumen de entradas, salidas, ajustes y traslados por periodo
      description: 'Resumen de entradas, salidas, ajustes y traslados por periodo (parámetros: desde, hasta)'
      x-roles:
      - Administrador
      - Responsable de inventario
      - Responsable de compras
      - Usuario de consulta
      responses:
        '200':
          description: OK
        '400':
          description: Solicitud incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Servicio necesario no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
        '403':
          description: Rol sin permiso
      parameters:
      - name: desde
        in: query
        required: false
        description: AAAA-MM-DD. Por defecto, 30 dias antes de hasta
        schema:
          type: string
          format: date
      - name: hasta
        in: query
        required: false
        description: AAAA-MM-DD. Por defecto, hoy
        schema:
          type: string
          format: date
  /api/reportes/dashboard:
    get:
      operationId: get_api_reportes_dashboard
      summary: Indicadores generales
      description: Indicadores generales (RF14)
      x-roles:
      - Todos
      responses:
        '200':
          description: OK
        '503':
          description: Servicio necesario no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
  /api/alertas:
    get:
      operationId: get_api_alertas
      summary: Consultar alertas
      description: 'Consultar alertas (filtros: estado_alerta, producto_id, bodega_id, page, limit)'
      x-roles:
      - Todos
      parameters:
      - name: estado_alerta
        in: query
        required: false
        schema:
          type: string
      - name: producto_id
        in: query
        required: false
        schema:
          type: integer
      - name: bodega_id
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
        '400':
          description: Solicitud incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
  /api/alertas/{id}/estado:
    patch:
      operationId: patch_api_alertas_id_estado
      summary: Marcar una alerta como ATENDIDA
      description: Marcar una alerta como ATENDIDA. Guarda atendida_en y el usuario (X-User-Id). Si ya estaba atendida
        responde 409.
      x-roles:
      - Administrador
      - Responsable de inventario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
        '400':
          description: Solicitud incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto con el estado actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
        '403':
          description: Rol sin permiso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - estado_alerta
              properties:
                estado_alerta:
                  type: string
                  enum:
                  - ATENDIDA
  /api/interno/alertas/stock:
    post:
      operationId: post_api_interno_alertas_stock
      summary: Recibir la notificación interna de stock
      description: Recibir la notificación interna de stock (solo Inventario)
      x-roles:
      - Credencial interna
      security:
      - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                evento:
                  type: string
                  description: STOCK_BAJO o STOCK_RECUPERADO
                producto_id:
                  type: integer
                  description: Producto
                bodega_id:
                  type: integer
                  description: Bodega
                cantidad_disponible:
                  type: integer
                  description: Existencias actuales; se guarda como cantidad_disponible_al_generar
                stock_minimo:
                  type: integer
                  description: Umbral configurado
              required:
              - evento
              - producto_id
              - bodega_id
              - cantidad_disponible
              - stock_minimo
      responses:
        '201':
          description: Creado
        '200':
          description: OK
        '400':
          description: Solicitud incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos que incumplen las reglas de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  schemas:
    Error:
      type: object
      properties:
        codigo:
          type: string
          example: STOCK_INSUFICIENTE
        mensaje:
          type: string
        detalles:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              error:
                type: string
        correlation_id:
          type: string
          format: uuid
security:
- bearerAuth: []
