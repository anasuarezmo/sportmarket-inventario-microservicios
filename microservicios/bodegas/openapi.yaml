openapi: 3.0.3
info:
  title: Bodegas - SportMarket S.A.S.
  version: 1.0.0
  description: 'Contrato API del microservicio Bodegas (framework Flask; base de datos: bodegas_db). Generado a
    partir de las tablas de contratos de la Entrega 2. Se accede únicamente a través del API Gateway.'
servers:
- url: http://localhost:8080
  description: API Gateway (desarrollo)
paths:
  /api/bodegas:
    get:
      operationId: get_api_bodegas
      summary: Consultar bodegas
      description: 'Consultar bodegas (filtros: ciudad, bodega_activa, page, limit)'
      x-roles:
      - Todos
      parameters:
      - name: ciudad
        in: query
        required: false
        schema:
          type: string
      - name: bodega_activa
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
    post:
      operationId: post_api_bodegas
      summary: Registrar bodega
      description: Registrar bodega
      x-roles:
      - Administrador
      - Responsable de inventario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codigo:
                  type: string
                  maxLength: 20
                  description: Código único de la bodega
                nombre:
                  type: string
                  maxLength: 100
                  description: Nombre de la bodega
                direccion:
                  type: string
                  maxLength: 150
                  description: Dirección física
                ciudad:
                  type: string
                  maxLength: 60
                  description: Ciudad donde se encuentra
              required:
              - codigo
              - nombre
              - direccion
              - ciudad
      responses:
        '201':
          description: Creado
        '400':
          description: Solicitud incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto con el estado actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/bodegas/{id}:
    get:
      operationId: get_api_bodegas_id
      summary: Consultar una bodega
      description: Consultar una bodega
      x-roles:
      - Todos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: put_api_bodegas_id
      summary: Actualizar bodega
      description: Actualizar bodega
      x-roles:
      - Administrador
      - Responsable de inventario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
        '400':
          description: Solicitud incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto con el estado actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/bodegas/{id}/estado:
    patch:
      operationId: patch_api_bodegas_id_estado
      summary: Activar o desactivar bodega
      description: Activar o desactivar bodega (bodega_activa)
      x-roles:
      - Administrador
      - Responsable de inventario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
        '400':
          description: Solicitud incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/bodegas/{id}/ubicaciones:
    get:
      operationId: get_api_bodegas_id_ubicaciones
      summary: Consultar ubicaciones de la bodega
      description: Consultar ubicaciones de la bodega
      x-roles:
      - Todos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: post_api_bodegas_id_ubicaciones
      summary: Registrar ubicación
      description: Registrar ubicación
      x-roles:
      - Administrador
      - Responsable de inventario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: Creado
        '400':
          description: Solicitud incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto con el estado actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/bodegas/{id}/ubicaciones/{ubicacion_id}:
    put:
      operationId: put_api_bodegas_id_ubicaciones_ubicacion_id
      summary: Actualizar ubicación
      description: Actualizar ubicación
      x-roles:
      - Administrador
      - Responsable de inventario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: ubicacion_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
        '400':
          description: Solicitud incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto con el estado actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/bodegas/{id}/ubicaciones/{ubicacion_id}/estado:
    patch:
      operationId: patch_api_bodegas_id_ubicaciones_ubicacion_id_estado
      summary: Activar o desactivar ubicación
      description: Activar o desactivar ubicación (ubicacion_activa)
      x-roles:
      - Administrador
      - Responsable de inventario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: ubicacion_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
        '400':
          description: Solicitud incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/bodegas/{id}/existencias:
    get:
      operationId: get_api_bodegas_id_existencias
      summary: Consultar las existencias de la bodega mediante Inventario
      description: 'Consultar las existencias de la bodega mediante Inventario (filtro: producto_id)'
      x-roles:
      - Todos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: producto_id
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Servicio necesario no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  schemas:
    Error:
      type: object
      properties:
        codigo:
          type: string
          example: STOCK_INSUFICIENTE
        mensaje:
          type: string
        detalles:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              error:
                type: string
        correlation_id:
          type: string
          format: uuid
security:
- bearerAuth: []
