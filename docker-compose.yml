# SportMarket: MySQL y los servicios de Edwin. Solo el Gateway publica puerto (8080).
# Servicios de Ana (usuarios, bodegas real, compras, devoluciones): agregar bloques nuevos con el mismo patron.
# Variables secretas: archivo .env en la raiz (no se sube a GitHub). Ver .env.example.
services:
  mysql:
    image: mysql:8.0
    container_name: sportmarket_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?falta MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  bodegas:
    # Simulado mientras no exista el servicio real (puerto 5002, bodegas 1 a 3). Reemplazar por el de Ana.
    image: node:lts-alpine
    restart: unless-stopped
    command: ["node", "/app/mock_bodegas.js"]
    volumes:
      - ./pruebas/edwin/mock_bodegas.js:/app/mock_bodegas.js:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  catalogo:
    build:
      context: .
      dockerfile: docker/catalogo/Dockerfile
    image: sportmarket-catalogo
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "3003"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?falta INTERNAL_TOKEN en .env}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: catalogo_db
      DB_USER: catalogo_user
      DB_PASSWORD: dev_password
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  inventario:
    build:
      context: .
      dockerfile: docker/inventario/Dockerfile
    image: sportmarket-inventario
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      catalogo:
        condition: service_healthy
      bodegas:
        condition: service_healthy
    environment:
      PORT: "3004"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?falta INTERNAL_TOKEN en .env}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: inventario_db
      DB_USER: inventario_user
      DB_PASSWORD: dev_password
      URL_CATALOGO: http://catalogo:3003
      URL_BODEGAS: http://bodegas:5002
      URL_REPORTES: http://reportes:5007
      TIMEOUT_MS: "3000"
      REINTENTOS: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  reportes:
    build:
      context: .
      dockerfile: docker/reportes/Dockerfile
    image: sportmarket-reportes
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "5007"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?falta INTERNAL_TOKEN en .env}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: reportes_db
      DB_USER: reportes_user
      DB_PASSWORD: dev_password
      URL_INVENTARIO: http://inventario:3004
      URL_CATALOGO: http://catalogo:3003
      TIMEOUT_SEG: "3"
      REINTENTOS: "3"
      CACHE_TTL_SEG: "30"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5007/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api-gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    image: sportmarket-gateway
    restart: unless-stopped
    depends_on:
      catalogo:
        condition: service_healthy
      inventario:
        condition: service_healthy
      reportes:
        condition: service_healthy
      bodegas:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?falta INTERNAL_TOKEN en .env}
      TIMEOUT_MS: "10000"
      URL_USUARIOS: http://usuarios:5001
      URL_BODEGAS: http://bodegas:5002
      URL_CATALOGO: http://catalogo:3003
      URL_INVENTARIO: http://inventario:3004
      URL_COMPRAS: http://compras:8005
      URL_DEVOLUCIONES: http://devoluciones:5006
      URL_REPORTES: http://reportes:5007

volumes:
  mysql_data:
