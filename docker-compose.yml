# SportMarket: MySQL y los 8 servicios. Solo el Gateway publica puerto (8080).
# Variables secretas: archivo .env en la raiz (no se sube a GitHub). Ver .env.example.
services:
  mysql:
    image: mysql:8.0
    container_name: sportmarket_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?falta MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  usuarios:
    build:
      context: .
      dockerfile: docker/usuarios/Dockerfile
    image: sportmarket-usuarios
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "5001"
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?falta INTERNAL_TOKEN en .env}
      JWT_EXPIRES_MINUTES: "60"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: usuarios_db
      DB_USER: usuarios_user
      DB_PASSWORD: dev_password
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  bodegas:
    build:
      context: .
      dockerfile: docker/bodegas/Dockerfile
    image: sportmarket-bodegas
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "5002"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?falta INTERNAL_TOKEN en .env}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: bodegas_db
      DB_USER: bodegas_user
      DB_PASSWORD: dev_password
      URL_INVENTARIO: http://inventario:3004
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  catalogo:
    build:
      context: .
      dockerfile: docker/catalogo/Dockerfile
    image: sportmarket-catalogo
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "3003"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?falta INTERNAL_TOKEN en .env}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: catalogo_db
      DB_USER: catalogo_user
      DB_PASSWORD: dev_password
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  inventario:
    build:
      context: .
      dockerfile: docker/inventario/Dockerfile
    image: sportmarket-inventario
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      catalogo:
        condition: service_healthy
      bodegas:
        condition: service_healthy
    environment:
      PORT: "3004"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?falta INTERNAL_TOKEN en .env}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: inventario_db
      DB_USER: inventario_user
      DB_PASSWORD: dev_password
      URL_CATALOGO: http://catalogo:3003
      URL_BODEGAS: http://bodegas:5002
      URL_REPORTES: http://reportes:5007
      TIMEOUT_MS: "3000"
      REINTENTOS: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  compras:
    build:
      context: .
      dockerfile: docker/compras/Dockerfile
    image: sportmarket-compras
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      catalogo:
        condition: service_healthy
      inventario:
        condition: service_healthy
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?falta INTERNAL_TOKEN en .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?falta DJANGO_SECRET_KEY en .env}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: compras_db
      DB_USER: compras_user
      DB_PASSWORD: dev_password
      URL_INVENTARIO: http://inventario:3004
      URL_CATALOGO: http://catalogo:3003
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  devoluciones:
    build:
      context: .
      dockerfile: docker/devoluciones/Dockerfile
    image: sportmarket-devoluciones
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      inventario:
        condition: service_healthy
    environment:
      PORT: "5006"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?falta INTERNAL_TOKEN en .env}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: devoluciones_db
      DB_USER: devoluciones_user
      DB_PASSWORD: dev_password
      URL_INVENTARIO: http://inventario:3004
      TIMEOUT_SEG: "3"
      REINTENTOS: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5006/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  reportes:
    build:
      context: .
      dockerfile: docker/reportes/Dockerfile
    image: sportmarket-reportes
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "5007"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?falta INTERNAL_TOKEN en .env}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: reportes_db
      DB_USER: reportes_user
      DB_PASSWORD: dev_password
      URL_INVENTARIO: http://inventario:3004
      URL_CATALOGO: http://catalogo:3003
      TIMEOUT_SEG: "3"
      REINTENTOS: "3"
      CACHE_TTL_SEG: "30"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5007/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api-gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    image: sportmarket-gateway
    restart: unless-stopped
    depends_on:
      usuarios:
        condition: service_healthy
      bodegas:
        condition: service_healthy
      catalogo:
        condition: service_healthy
      inventario:
        condition: service_healthy
      compras:
        condition: service_healthy
      devoluciones:
        condition: service_healthy
      reportes:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?falta INTERNAL_TOKEN en .env}
      TIMEOUT_MS: "10000"
      URL_USUARIOS: http://usuarios:5001
      URL_BODEGAS: http://bodegas:5002
      URL_CATALOGO: http://catalogo:3003
      URL_INVENTARIO: http://inventario:3004
      URL_COMPRAS: http://compras:8005
      URL_DEVOLUCIONES: http://devoluciones:5006
      URL_REPORTES: http://reportes:5007

volumes:
  mysql_data:
